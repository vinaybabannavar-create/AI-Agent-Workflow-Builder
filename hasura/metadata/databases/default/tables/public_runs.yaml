table:
  schema: public
  name: workflow_runs
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_run_id
        table:
          schema: public
          name: step_runs
select_permissions:
  - role: owner
    permission:
      columns: "*"
      filter:
        workflow:
          org_id:
            _in: "X-Hasura-Org-Ids"
  - role: editor
    permission:
      columns: "*"
      filter:
        workflow:
          org_id:
            _in: "X-Hasura-Org-Ids"
  - role: viewer
    permission:
      columns: "*"
      filter:
        workflow:
          org_id:
            _in: "X-Hasura-Org-Ids"
---
table:
  schema: public
  name: step_runs
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: workflow_step_id
select_permissions:
  - role: owner
    permission:
      columns: "*"
      filter:
        workflow_run:
          workflow:
            org_id:
              _in: "X-Hasura-Org-Ids"
  - role: editor
    permission:
      columns: "*"
      filter:
        workflow_run:
          workflow:
            org_id:
              _in: "X-Hasura-Org-Ids"
  - role: viewer
    permission:
      columns: "*"
      filter:
        workflow_run:
          workflow:
            org_id:
              _in: "X-Hasura-Org-Ids"
